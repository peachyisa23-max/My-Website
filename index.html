<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeachFlix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>PeachFlix</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#base44">PeachFlix App</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <h2>Welcome to PeachFlix</h2>
        <p>Your custom website connected to your Base44 streaming app.</p>
        <a href="#base44" class="btn">Open PeachFlix App</a>
    </section>

    <section id="base44" class="section">
        <h2>PeachFlix App</h2>
        <p>Your Base44 app is embedded directly inside this website.</p>

        <iframe 
            src="https://peachflix.base44.app"
            class="embed"
            frameborder="0">
        </iframe>

        <a href="https://peachflix.base44.app" class="btn" target="_blank">
            Open Full App
        </a>
    </section>

    <section id="contact" class="section">
        <h2>Contact</h2>
        <p>Email: yourname@example.com</p>
    </section>

</body>
</html>
